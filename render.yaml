services:
  - type: web
    name: memory-ai-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.address 0.0.0.0 --server.port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MEMORYAI_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDER_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MEM0_COLLECTION
        value: memory-ai-agent
      - key: QDRANT_PATH
        value: ./qdrant_data
